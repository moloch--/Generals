name: Build Windows

permissions:
  contents: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to build (GeneralsMD, Generals)"
      preset:
        required: false
        type: string
        default: "win32-vcpkg"
        description: "CMake preset for Windows"
  workflow_dispatch:
    inputs:
      game:
        type: choice
        description: "Game to build"
        options:
          - GeneralsMD
          - Generals
        default: GeneralsMD
      preset:
        type: choice
        description: "CMake preset for Windows"
        options:
          - win32-vcpkg
        default: win32-vcpkg

jobs:
  build-windows:
    name: Windows SFX launcher validation
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/tooling/sfx/go.mod
          cache-dependency-path: scripts/tooling/sfx/go.sum

      # GeneralsX @test OpenAI 02/08/2026 Exercise Windows file syncing and a real packed launcher.
      - name: Test Windows SFX launcher
        working-directory: scripts/tooling/sfx
        run: go test -count=1 ./...
