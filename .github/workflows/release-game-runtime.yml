name: Build and release game runtimes

# GeneralsX @build Codex 10/10/2026 Build asset-free native engines for the local installer.
on:
  push:
    tags: ['runtime-v*']
    branches: [main]
    paths:
      - 'GeneralsMD/**'
      - 'Core/**'
      - 'Dependencies/**'
      - 'Patches/**'
      - 'cmake/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg*'
      - 'go.mod'
      - 'go.sum'
      - 'GeneralsZH/Data/Window/**'
      - 'assets/**'
      - 'scripts/build/**'
      - 'scripts/tooling/sfx/**'
      - 'internal/runtimebundle/**'
      - 'internal/buildcli/**'
      - 'cmd/generalsx-runtime-pack/**'
      - '.github/workflows/release-game-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: game-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  GX_ONLINE_SERVER_DEFAULT: tls://multiplayer.generals.network
  VCPKG_COMMIT: ffc071e0c08432c60c9b64f00334c0227667931b

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          publish=false
          # Untagged/manual builds exercise the complete producer without publishing.
          version=runtime-v0.0.0
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^runtime-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            [[ "$(git rev-parse "refs/tags/${REF_NAME}^{commit}")" == "$commit" ]] || exit 1
            version="$REF_NAME"
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            preset: linux64-deploy
          - target: macos-arm64
            runner: macos-15
            preset: macos-vulkan
          - target: windows-x86
            runner: windows-2025
            preset: win32-vcpkg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      RUNTIME_VERSION: ${{ needs.identity.outputs.version }}
      SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
      TARGET: ${{ matrix.target }}
      PRESET: ${{ matrix.preset }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.runtime-vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/tooling/sfx/go.sum
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: .runtime-vcpkg-cache
          key: runtime-vcpkg-${{ matrix.runner }}-${{ matrix.target }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg*.json', 'cmake/**', 'CMakePresets.json', '.github/workflows/release-game-runtime.yml') }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl ca-certificates zip unzip tar pkg-config \
            python3 autoconf automake autoconf-archive libtool libltdl-dev \
            libopenal-dev libasound2-dev libpulse-dev libaudio-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libpng-dev zlib1g-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev \
            libwayland-dev libdecor-0-dev liburing-dev libvulkan-dev
      - name: Install macOS build dependencies and pinned Vulkan SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          brew install cmake ninja meson pkg-config autoconf autoconf-archive automake libtool \
            ffmpeg freetype fontconfig glslang sdl3
          sdk_zip="$RUNNER_TEMP/vulkansdk-macos-1.4.341.1.zip"
          curl --fail --location --retry 3 --output "$sdk_zip" \
            https://sdk.lunarg.com/sdk/download/1.4.341.1/mac/vulkansdk-macos-1.4.341.1.zip
          echo "632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e  $sdk_zip" | shasum -a 256 --check
          unzip -q "$sdk_zip" -d "$RUNNER_TEMP/vulkan-installer"
          installer="$(find "$RUNNER_TEMP/vulkan-installer" -type f -name vulkansdk-macOS-1.4.341.1 -print -quit)"
          test -n "$installer"
          chmod +x "$installer"
          "$installer" --root "$RUNNER_TEMP/VulkanSDK/1.4.341.1" \
            --accept-licenses --default-answer --confirm-command install
          sdk="$RUNNER_TEMP/VulkanSDK/1.4.341.1/macOS"
          test -s "$sdk/lib/libvulkan.dylib"
          test -s "$sdk/lib/libMoltenVK.dylib"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/runtime-vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout --detach "$VCPKG_COMMIT"
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$root/bootstrap-vcpkg.bat" -disableMetrics
            echo "VCPKG_ROOT=$(cygpath -w "$root")" >> "$GITHUB_ENV"
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          fi
          mkdir -p .runtime-vcpkg-cache
      - name: Build and export POSIX engine
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs build/runtime-stage
          cmake --preset "$PRESET" -DRTS_BUILD_OPTION_DEBUG=OFF \
            -DSAGE_ONLINE_SERVER_DEFAULT="$GX_ONLINE_SERVER_DEFAULT" \
            2>&1 | tee logs/runtime-configure.log
          cmake --build "build/$PRESET" --target z_generals --parallel 3 \
            2>&1 | tee logs/runtime-build.log
          if [[ "$TARGET" == linux-amd64 ]]; then
            bash scripts/build/linux/export-runtime-linux-zh.sh "build/runtime-stage/$TARGET"
          else
            bash scripts/build/macos/export-runtime-macos-zh.sh "build/runtime-stage/$TARGET"
          fi
          python3 scripts/build/collect-runtime-metadata.py --repo . --build-dir "build/$PRESET" \
            --runtime-dir "build/runtime-stage/$TARGET" --target "$TARGET"
      - name: Build and export native Windows x86 engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/runtime-stage, logs -Force | Out-Null
          & ./scripts/build/windows/build-sfx-windows-zh.ps1 `
            -RuntimeOutputDirectory "build/runtime-stage/$env:TARGET" 2>&1 | Tee-Object logs/runtime-build.log
          python scripts/build/collect-runtime-metadata.py --repo . --build-dir "build/$env:PRESET" `
            --runtime-dir "build/runtime-stage/$env:TARGET" --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Runtime metadata collection failed.' }
      - name: Pack and validate runtime
        shell: bash
        env:
          PUBLISH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          extra=()
          go test ./...
          if [[ "$TARGET" == linux-amd64 ]]; then
            glibc="$(python3 -c 'import json; print(json.load(open("build/runtime-stage/linux-amd64/build-metadata.json"))["minimum_glibc"])')"
            extra+=(--minimum-glibc "$glibc")
          elif [[ "$TARGET" == macos-arm64 ]]; then
            extra+=(--minimum-os 15.0)
          elif [[ "$TARGET" == windows-x86 ]]; then
            extra+=(--minimum-os 10.0)
          fi
          go run ./cmd/generalsx-runtime-pack --target "$TARGET" \
            --runtime-dir "$GITHUB_WORKSPACE/build/runtime-stage/$TARGET" --repository "$PUBLISH_REPOSITORY" \
            --version "$RUNTIME_VERSION" --commit "$SOURCE_COMMIT" --output-dir "$GITHUB_WORKSPACE/dist" --repo "$GITHUB_WORKSPACE" \
            --online-endpoint "$GX_ONLINE_SERVER_DEFAULT" --preset "$PRESET" "${extra[@]}"
          test -s "dist/generalsxzh-runtime-${RUNTIME_VERSION}-${TARGET}.json"
          test -s "dist/generalsxzh-runtime-${RUNTIME_VERSION}-${TARGET}.tar.gz"
      - name: Upload runtime output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-logs-${{ matrix.target }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [identity, build]
    if: needs.identity.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUNTIME_VERSION: ${{ needs.identity.outputs.version }}
      SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: runtime-package-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify complete target set and publish new immutable version
        shell: bash
        run: |
          set -euo pipefail
          expected=()
          for target in linux-amd64 macos-arm64 windows-x86; do
            expected+=("generalsxzh-runtime-${RUNTIME_VERSION}-${target}.json")
            expected+=("generalsxzh-runtime-${RUNTIME_VERSION}-${target}.tar.gz")
          done
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          for asset in "${expected[@]}"; do test -s "dist/$asset"; done
          go build -o "$RUNNER_TEMP/verify-runtime" ./cmd/generalsx-runtime-pack
          for target in linux-amd64 macos-arm64 windows-x86; do
            stem="generalsxzh-runtime-${RUNTIME_VERSION}-${target}"
            "$RUNNER_TEMP/verify-runtime" --verify-descriptor "dist/$stem.json" \
              --archive "dist/$stem.tar.gz" --repository "$GH_REPO" \
              --version "$RUNTIME_VERSION" --commit "$SOURCE_COMMIT" --target "$target" \
              --online-endpoint "$GX_ONLINE_SERVER_DEFAULT"
          done
          # The producer validates archives; the final source identity is checked again before publication.
          [[ "$(gh api "repos/$GH_REPO/commits/$RUNTIME_VERSION" --jq .sha)" == "$SOURCE_COMMIT" ]]
          if gh release view "$RUNTIME_VERSION" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing runtime release. Use a new version.' >&2
            exit 1
          fi
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS && sha256sum --check SHA256SUMS)
          notes="$RUNNER_TEMP/runtime-notes.md"
          printf '%s\n' \
            'Native Zero Hour engines and redistributable runtime dependencies for the Automated Build Tool.' \
            '' 'Targets: Linux x86_64, macOS arm64 (15.0+), exploratory Windows x86.' \
            'No retail game assets are included. Combine with your owned assets locally.' \
            "Source: $SOURCE_COMMIT" > "$notes"
          gh release create "$RUNTIME_VERSION" --verify-tag --draft --latest=false \
            --title "GeneralsX game runtime $RUNTIME_VERSION" --notes-file "$notes"
          gh release upload "$RUNTIME_VERSION" dist/*
          expected+=(SHA256SUMS)
          diff -u <(printf '%s\n' "${expected[@]}" | sort) \
            <(gh release view "$RUNTIME_VERSION" --json assets --jq '.assets[].name' | sort)
          [[ -z "$(gh release view "$RUNTIME_VERSION" --json assets --jq '.assets[] | select(.size <= 0) | .name')" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$RUNTIME_VERSION" --jq .sha)" == "$SOURCE_COMMIT" ]]
          gh release edit "$RUNTIME_VERSION" --draft=false --latest=false
          [[ "$(gh release view "$RUNTIME_VERSION" --json isDraft --jq .isDraft)" == false ]]
